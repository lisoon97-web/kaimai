<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>开麦华文播客</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: on wide screens a booth guide on the left and a phone (student) or wide panel (teacher) on the right; on phones the app fills the screen. */
:root{
  --paper:#EEF1F8; --card:#FFFFFF; --sunk:#E4E8F3; --ink:#141A33; --muted:#5B6385; --line:#D6DCEB;
  --accent:#2F45E0; --accent-soft:#E3E7FF; --onair:#FFC53D; --onair-ink:#3A2A00;
  --agree:#0B7F70; --agree-soft:#DDF3EF; --differ:#7136C9; --differ-soft:#EEE5FB; --ask:#A35C00; --ask-soft:#FCEED8;
  --danger:#C2342A; --danger-soft:#FBE3E0; --ok:#1A8657;
  --shadow:0 18px 50px -20px rgba(20,26,51,.35);
  --f-display:"ZCOOL QingKe HuangYou","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C1022; --card:#161B32; --sunk:#1E2442; --ink:#E8EBF8; --muted:#9AA2C6; --line:#2A3154;
  --accent:#8193FF; --accent-soft:#252E63; --onair:#FFC53D; --onair-ink:#3A2A00;
  --agree:#4CCDB9; --agree-soft:#123A36; --differ:#B48CF5; --differ-soft:#2D2050; --ask:#F2A94A; --ask-soft:#3E2C12;
  --danger:#FF7A6E; --danger-soft:#43201D; --ok:#4BC98C; --shadow:0 18px 50px -20px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C1022; --card:#161B32; --sunk:#1E2442; --ink:#E8EBF8; --muted:#9AA2C6; --line:#2A3154;
  --accent:#8193FF; --accent-soft:#252E63; --onair:#FFC53D; --onair-ink:#3A2A00;
  --agree:#4CCDB9; --agree-soft:#123A36; --differ:#B48CF5; --differ-soft:#2D2050; --ask:#F2A94A; --ask-soft:#3E2C12;
  --danger:#FF7A6E; --danger-soft:#43201D; --ok:#4BC98C; --shadow:0 18px 50px -20px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding-inline:16px;padding-block:16px;max-width:1240px;margin:0 auto;align-items:start}
@media (min-width:980px){.shell{grid-template-columns:320px minmax(0,1fr);gap:40px;padding-block:28px}}

/* Guide */
.guide{display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-family:var(--f-display);font-size:44px;line-height:1;letter-spacing:.02em}
.onair{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.14em;background:var(--onair);color:var(--onair-ink);padding:3px 8px;border-radius:4px}
.tagline{color:var(--muted);margin:0;max-width:30em}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-mono);font-weight:600;font-size:13px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper)}
.steps b{display:block}
.steps span{color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px;margin:0}
details.guide-m{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
details.guide-m summary{font-weight:700;cursor:pointer}
details.guide-m .steps{margin-top:10px}
@media (min-width:980px){.guide-m{display:none}}
@media (max-width:979px){.guide{display:none}}

.stage{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.switch{display:inline-flex;background:var(--sunk);border-radius:999px;padding:4px;gap:4px}
.switch button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stage-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.sync{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--sunk);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on{color:var(--ok)}.sync.on i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.sync.off i{background:var(--ask)}
.reset{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}

.device{position:relative;width:100%;max-width:400px;height:min(840px,calc(100dvh - 110px));min-height:560px;background:var(--paper);border:1px solid var(--line);border-radius:34px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.device.wide{max-width:820px;border-radius:20px}
@media (max-width:520px){.device{border-radius:20px;height:calc(100dvh - 150px)}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 18px 24px}
.appbar{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;padding:16px 0 12px;margin:0}
.appbar h1{margin:0;font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .logo{font-size:30px}
.classtag{font-size:12px;color:var(--muted);background:var(--sunk);padding:3px 10px;border-radius:999px;white-space:nowrap}
.iconbtn{border:0;background:var(--sunk);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}

.nav{display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:end;border-top:1px solid var(--line);background:var(--card);padding:8px 10px 10px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:4px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav .micbtn{width:64px;height:64px;margin:-30px auto 0;border-radius:50%;background:var(--accent);color:#fff;box-shadow:0 8px 20px -6px var(--accent);justify-content:center;border:4px solid var(--paper)}
.nav .micbtn svg{width:26px;height:26px}
.nav .miclabel{text-align:center;font-size:12px;color:var(--muted);margin-top:2px}

.eyebrow{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:18px 0 8px}
.feature{background:var(--ink);color:var(--paper);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.feature .onair{align-self:flex-start}
.feature h2{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.15;margin:0;text-wrap:balance}
.feature p{margin:0;opacity:.8;font-size:14px}
.feature .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.feature .meta{font-size:13px;opacity:.75}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);color:#fff}
.btn.onair-b{background:var(--onair);color:var(--onair-ink)}
.btn.ghost{background:transparent;border:1px solid currentColor}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.tcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.tcard .t{flex:1;min-width:0}
.tcard b{display:block;font-size:15px}
.tcard small{color:var(--muted)}
.tlist{display:grid;gap:10px}
.archived{opacity:.75}

.avs{display:flex}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.avs .av{width:24px;height:24px;font-size:11px;border:2px solid var(--ink);margin-left:-6px}
.avs .av:first-child{margin-left:0}

/* post */
.post{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.post.pinned{border-color:var(--onair);box-shadow:inset 0 0 0 1px var(--onair)}
.phead{display:flex;align-items:center;gap:10px}
.phead .who{flex:1;min-width:0}
.phead .who b{display:block;font-size:14px}
.phead .who small{color:var(--muted);font-size:12px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.pin{background:var(--onair);color:var(--onair-ink)}
.player{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:14px;padding:8px 12px 8px 8px}
.play{width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.play svg{width:16px;height:16px}
.play .i-pause{display:none}
.play.on .i-pause{display:block}.play.on .i-play{display:none}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:30px;min-width:0}
.wave i{flex:1;background:var(--line);border-radius:2px;min-width:2px}
.wave i.done{background:var(--accent)}
.dur{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.excerpt{margin:0;font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pfoot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:13px}
.linkbtn.muted{color:var(--muted);font-weight:500}
.plist{display:grid;gap:12px}
.likebtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px 4px 10px;font-size:13px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.likebtn svg{width:16px;height:16px}
.likebtn[aria-pressed="true"]{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.likebtn[aria-pressed="true"] svg{fill:currentColor}
.likebtn.pop svg{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.35)}}
.mylikes{font-size:12px;color:var(--danger);font-weight:700;display:inline-flex;align-items:center;gap:4px}
.mylikes svg{width:14px;height:14px;fill:currentColor}
.pfoot .l{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.transcript{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0;font-size:15px;line-height:1.85}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tag.agree{background:var(--agree-soft);color:var(--agree)}
.tag.differ{background:var(--differ-soft);color:var(--differ)}
.tag.ask{background:var(--ask-soft);color:var(--ask)}
.resp{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.resp:last-child{border-bottom:0}
.resp .rb{min-width:0;display:flex;flex-direction:column;gap:6px}
.resp .rh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.resp .rh small{color:var(--muted)}
.resp p{margin:0;font-size:14px}
.mini{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:999px;padding:4px 12px 4px 4px;align-self:flex-start;max-width:100%}
.mini .play{width:28px;height:28px}
.mini .play svg{width:12px;height:12px}
.mini .wave{width:90px;flex:none;height:20px}

.composer{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.chip[aria-pressed="true"].agree{border-color:var(--agree);background:var(--agree-soft);color:var(--agree)}
.chip[aria-pressed="true"].differ{border-color:var(--differ);background:var(--differ-soft);color:var(--differ)}
.chip[aria-pressed="true"].ask{border-color:var(--ask);background:var(--ask-soft);color:var(--ask)}
.chip[aria-pressed="true"].plain{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--muted);display:flex;gap:5px;align-items:center}
.seg button svg{width:14px;height:14px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.login{max-width:340px;margin:40px auto 0;display:flex;flex-direction:column;gap:12px;text-align:center}
.login .lk{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto}
.login .lk svg{width:26px;height:26px}
.login h2{margin:0;font-size:20px}
.login input{text-align:center;font-family:var(--f-mono);font-size:20px;letter-spacing:.3em}
.err{color:var(--danger);font-size:13px;font-weight:700;margin:0}
textarea,input[type=text],input[type=date],input[type=password]{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;resize:vertical}
textarea{min-height:84px;line-height:1.7}
label.fl{font-size:13px;font-weight:700;display:block;margin-bottom:4px}
.hint{font-size:12px;color:var(--muted);margin:0}

/* rec */
.stepper{display:flex;gap:6px;margin:4px 0 6px}
.stepper span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.stepper span.on{background:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.panel h3 svg{width:18px;height:18px;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:12px}
.spark{background:var(--onair);color:var(--onair-ink);border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;animation:flip .35s ease}
@keyframes flip{from{transform:rotateX(70deg);opacity:0}to{transform:none;opacity:1}}
.rescue{display:flex;gap:8px}
.rescue input{flex:1;min-width:0}
.rescue-out{font-size:14px}
.rescue-out b{font-size:20px;font-weight:900}
.topicpick{display:grid;gap:8px}
.topicpick button{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.topicpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

.onairbox{background:var(--ink);color:var(--paper);border-radius:26px;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.bigtime{font-family:var(--f-mono);font-size:48px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.bigtime small{font-size:16px;opacity:.6}
.live{display:flex;gap:4px;align-items:center;height:60px}
.live i{width:5px;border-radius:3px;background:var(--onair);height:20%;animation:lv 1s ease-in-out infinite}
.live.idle i{animation:none;opacity:.35}
.live.real i{animation:none;transition:height .08s linear}
.livecap{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;font-size:14px;min-height:44px;width:100%;text-align:left;opacity:.9}
.livecap small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;opacity:.6}
.errbox{background:var(--danger-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:8px;text-align:left}
.errbox b{color:var(--danger)}
@keyframes lv{0%,100%{height:15%}50%{height:95%}}
.recbtn{width:84px;height:84px;border-radius:50%;border:6px solid rgba(255,255,255,.18);background:var(--danger);color:#fff;display:grid;place-items:center}
.recbtn svg{width:30px;height:30px}
.recbtn.stop{background:var(--onair);color:var(--onair-ink)}
.onairbox p{margin:0;opacity:.75;font-size:14px}

.echo{display:grid;gap:10px}
.fb{border-radius:14px;padding:12px 14px;font-size:14px}
.fb h4{margin:0 0 4px;font-size:13px}
.fb ul{margin:0;padding-left:18px}
.fb.good{background:var(--agree-soft)}.fb.good h4{color:var(--agree)}
.fb.try{background:var(--ask-soft)}.fb.try h4{color:var(--ask)}
.fb.words{background:var(--accent-soft)}.fb.words h4{color:var(--accent)}
.wordrow{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}
.wordrow:last-child{border:0}
.wordrow span:first-child{font-family:var(--f-mono);font-size:13px}
.private{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.private svg{width:14px;height:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 9px;font-size:13px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:24px 12px;border:1.5px dashed var(--line);border-radius:16px;font-size:14px}

/* teacher */
.ttabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -18px 14px;padding:0 18px;overflow-x:auto}
.ttabs button{border:0;background:none;padding:10px 12px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.ttabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.count{background:var(--danger);color:#fff;font-size:11px;border-radius:999px;padding:0 6px;font-family:var(--f-mono)}
.tgrid{display:grid;gap:16px}
@media (min-width:760px){.device.wide .tgrid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.trow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border:0}
.trow .tx{flex:1;min-width:0}
.trow .tx b{display:block;font-size:14px}
.trow .tx small{color:var(--muted);font-size:12px}
.st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st.live{background:var(--agree-soft);color:var(--agree)}
.st.sched{background:var(--accent-soft);color:var(--accent)}
.st.arch{background:var(--sunk);color:var(--muted)}
.radio{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;align-items:center}
.mod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mod.hid{opacity:.6;border-style:dashed}
.mod .mh{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.mod .mh b{font-size:14px}
.mod .mh small{color:var(--muted)}
.mod p{margin:0;font-size:14px}
.flag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--danger-soft);color:var(--danger);white-space:nowrap}
.flag.ai{background:var(--ask-soft);color:var(--ask)}
.flag.h{background:var(--sunk);color:var(--muted)}
.confirm{background:var(--danger-soft);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--danger);font-weight:700}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--sunk)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.quiet{background:var(--ask-soft);color:var(--ask);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.privnote{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin:8px 0 0}
.privnote svg{width:14px;height:14px;flex:none}

.nav button{position:relative}
.livedot{position:absolute;top:2px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--card)}
.shell.projmode{grid-template-columns:minmax(0,1fr);max-width:none}
.shell.projmode .guide,.shell.projmode details.guide-m{display:none}
.device.proj{max-width:1240px;border-radius:16px;height:min(900px,calc(100dvh - 110px))}
.projwrap{padding:0 28px 28px}
.projtop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 0 4px;position:sticky;top:0;background:var(--paper);z-index:5}
.projtitle{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4vw,52px);line-height:1.15;margin:6px 0 4px;text-wrap:balance}
.projq{font-size:20px;margin:6px 0 18px;color:var(--muted);font-weight:700}
.proj .bartrack{height:42px}.proj .barrow{grid-template-columns:64px 1fr 48px}.proj .barrow .em{font-size:38px}.proj .barrow .n{font-size:24px}
.proj .track{height:96px}.proj .dot{width:24px;height:24px}.proj .tracklabels{font-size:16px}
.proj .excard p{font-size:17px}.proj .exseg{font-size:17px}
.banner{width:100%;text-align:left;border:0;background:var(--onair);color:var(--onair-ink);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;margin-bottom:12px;font-weight:700;font-size:13px}
.banner .t{flex:1;min-width:0}.banner .t b{display:block;font-size:15px}.banner .t small{font-weight:500}
.feelrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.feelbtn{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--ink)}
.feelbtn span{font-size:28px;line-height:1.1}
.feelbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
input[type=range]{width:100%;accent-color:var(--accent);height:34px;margin:4px 0}
.track{position:relative;height:56px;margin:30px 12px 6px;background:linear-gradient(to right,var(--danger-soft),var(--sunk) 50%,var(--agree-soft));border-radius:999px}
.dot{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);background:var(--accent);opacity:.8;border:2px solid var(--card);padding:0}
button.dot{cursor:pointer}
.dot.spot,.dot.me{background:var(--onair);opacity:1;z-index:3;width:22px;height:22px}
.dot.before{background:var(--muted);opacity:.4}
.spotlab{position:absolute;top:-4px;transform:translate(-50%,-100%);background:var(--ink);color:var(--paper);font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap;z-index:4}
.tracklabels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:44px 1fr 36px;gap:10px;align-items:center}
.barrow .em{font-size:24px;text-align:center}
.bartrack{height:26px;background:var(--sunk);border-radius:8px;overflow:hidden}
.bar{height:100%;background:var(--accent);border-radius:8px;min-width:3px;transition:width .4s ease}
.barrow .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.barrow .names{grid-column:2/-1;font-size:12px;color:var(--muted);margin-top:-4px}
.wallgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wallgrid.big{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.wallcard{border-radius:12px;padding:12px;font-size:14px;box-shadow:0 2px 8px -2px rgba(20,26,51,.18)}
.wallcard p{margin:0}
.wallcard.w0{background:var(--onair);color:var(--onair-ink)}
.wallcard.w1{background:var(--accent-soft);color:var(--ink)}
.wallcard.w2{background:var(--agree-soft);color:var(--ink)}
.wallgrid.big .wallcard{font-size:19px;padding:16px}
.wallcard.hid{opacity:.4;text-decoration:line-through}
.wallfoot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px}
.exgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:760px){.device.wide .exgrid,.device.proj .exgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.excard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.excard p{margin:0;font-size:14px;line-height:1.85}
.exhead{display:flex;justify-content:space-between;align-items:center}
.play.sm{width:32px;height:32px}.play.sm svg{width:13px;height:13px}
.exseg{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;width:100%;text-align:left;border:0;border-left:4px solid;border-radius:0 12px 12px 0;padding:10px 12px;font-size:14px;line-height:1.8;color:var(--ink)}
.exseg b{display:block;font-size:12px}
.exseg.on{outline:2px solid var(--accent);outline-offset:1px}
.stepchip{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font-weight:900;font-size:14px;color:var(--card);flex:none}
.lvlcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lvlcard{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.lvlcard b{font-size:15px}.lvlcard small{color:var(--muted);font-size:12px;line-height:1.4}
.lvlcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rub{display:flex;flex-direction:column}
.rubrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rubrow:last-child{border:0}
.rt b{display:block;font-size:14px}.rt small{color:var(--muted);font-size:12px;line-height:1.4;display:block}
.rpill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.rpills{display:inline-flex;gap:3px;flex-wrap:wrap;vertical-align:middle}
.rp{width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;font-size:12px;font-weight:900}
.l2{background:var(--agree-soft);color:var(--agree)}.l1{background:var(--ask-soft);color:var(--ask)}.l0{background:var(--danger-soft);color:var(--danger)}.ln{background:var(--sunk);color:var(--muted)}
.tcard .rpills{margin-top:4px;display:flex}
.segcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;width:100%;text-align:left;color:var(--ink)}
.segcard .t{flex:1;min-width:0}.segcard .t b{display:block;font-size:14px}.segcard .t small{color:var(--muted);font-size:12px}
.segcard.cur{flex-direction:column;align-items:stretch;border-color:var(--accent);gap:10px}
.segcard.done:not(.cur){background:var(--paper)}
.scaf{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.scafh{display:flex;gap:8px;align-items:center}
.scaf p{margin:0;font-size:14px}
.starters{display:flex;flex-wrap:wrap;gap:6px}
.starters span{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:3px 9px;font-size:13px}
.scafrow{display:flex;flex-wrap:wrap;gap:6px}
.scafpill{border:1.5px solid;border-radius:999px;padding:4px 10px;font-size:13px;display:inline-flex;gap:6px;font-weight:700}
.scafline{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;font-size:13px}
.scafline b{display:block;font-size:14px}
.progress{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:4px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.segline{display:grid;grid-template-columns:26px 32px minmax(0,1fr);gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.segline:last-child{border:0}
.segtext{font-size:14px}
.exmp{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.exmp .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}.exmp .mh small{color:var(--muted)}
.cm{background:var(--sunk);border-radius:12px;padding:10px 12px}
.cm p{margin:0;font-size:14px}.cm small{color:var(--muted);font-size:12px}
.stagebar{display:flex;gap:6px;flex-wrap:wrap}
.stagebtn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center;color:var(--ink)}
.stagebtn small{font-family:var(--f-mono);color:var(--muted)}
.stagebtn[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:#fff}
.stagebtn[aria-current="step"] small{color:#fff}
.clshead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.clshead h3{margin:0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
details.panel summary{list-style-position:inside}

.joincard{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}
.joincard .qr{width:116px;flex:none;background:#fff;border-radius:10px;overflow:hidden;line-height:0}
.joincard .qr svg{width:100%;height:auto;display:block}
.joincard.big{padding:18px;gap:24px;margin:10px 0 18px}
.joincard.big .qr{width:min(300px,38vw)}
.jtx{display:flex;flex-direction:column;gap:4px;min-width:0}
.jtx b{font-size:16px}.joincard.big .jtx b{font-size:30px}
.jurl{font-family:var(--f-mono);font-size:13px;word-break:break-all;color:var(--accent)}.joincard.big .jurl{font-size:20px}
.jtx small{color:var(--muted);font-size:12px;line-height:1.5}.joincard.big .jtx small{font-size:16px}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;z-index:20;box-shadow:var(--shadow);max-width:90%;overflow:hidden;text-overflow:ellipsis}
.device.wide .toast{bottom:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* RAW holds flat records (same shape locally and in Firestore); D is the view built from it. */
let RAW={users:[],topics:[],proposals:[],posts:[],responses:[],session:[],checkins:[],practices:[]};
let D={students:[],topics:[],proposals:[],posts:[],drafts:[],words:[],session:null,checkins:[],practices:[]};
let CLOUD=false,LOADED=false,db=null,UNSUB=[],MYID='me',ME=null;
const AUD={}; // audioId -> data URL cache
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let LIKED=new Set(ls.get('kaimai_liked',[]));

function rel(ts){if(!ts)return '';const mi=Math.floor((Date.now()-ts)/60000);if(mi<1)return '刚刚';if(mi<60)return mi+' 分钟前';const h=Math.floor(mi/60);if(h<24)return h+' 小时前';const d=Math.floor(h/24);if(d<14)return d+' 天前';return Math.floor(d/7)+' 周前'}
function buildView(){
  const users=[...RAW.users];
  if(ME&&!users.some(u=>u.id===ME.id))users.push(ME);
  D.students=users;
  D.topics=[...RAW.topics].sort((a,b)=>(b.order||0)-(a.order||0));
  D.proposals=[...RAW.proposals].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const resp=[...RAW.responses].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).map(r=>Object.assign({},r,{when:rel(r.createdAt)}));
  D.posts=[...RAW.posts].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(p=>Object.assign({},p,{when:rel(p.createdAt),resp:resp.filter(r=>r.post===p.id)}));
  D.session=(RAW.session||[]).find(x=>x.id==='live')||null;
  D.checkins=[...(RAW.checkins||[])];
  D.practices=[...(RAW.practices||[])].sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0)).map(p=>Object.assign({},p,{when:rel(p.updatedAt||p.createdAt)}));
}
const BAD=/蠢|笨蛋|白痴|闭嘴|垃圾|去死|废物|丑八怪|神经病|智障|滚开/;
const aiFlag=t=>BAD.test(t||'')?'可能含贬低他人的用语':null;
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- data API: every change goes through here (local arrays or Firestore) ---------- */
const api={
  async add(col,obj){
    obj.id=obj.id||newId(col[0]);obj.createdAt=obj.createdAt||Date.now();
    if(CLOUD){const {id,...rest}=obj;await db.collection(col).doc(id).set(clean(rest))}
    else{RAW[col].push(obj);refresh()}
    return obj.id;
  },
  async upsert(col,id,fields){
    if(CLOUD){await db.collection(col).doc(id).set(clean(fields),{merge:true})}
    else{let o=RAW[col].find(x=>x.id===id);if(!o){o={id,createdAt:Date.now()};RAW[col].push(o)}Object.assign(o,fields);refresh()}
  },
  async update(col,id,fields){
    if(CLOUD){const f={};for(const k in fields)f[k]=fields[k]===undefined?firebase.firestore.FieldValue.delete():fields[k];await db.collection(col).doc(id).update(f)}
    else{const o=RAW[col].find(x=>x.id===id);if(!o)return;for(const k in fields){if(fields[k]===undefined)delete o[k];else o[k]=fields[k]}refresh()}
  },
  async inc(col,id,field,n){
    if(CLOUD)await db.collection(col).doc(id).update({[field]:firebase.firestore.FieldValue.increment(n)});
    else{const o=RAW[col].find(x=>x.id===id);if(o){o[field]=(o[field]||0)+n;refresh()}}
  },
  async remove(col,id){
    if(CLOUD){
      const b=db.batch();
      if(col==='posts'){RAW.responses.filter(r=>r.post===id).forEach(r=>{b.delete(db.collection('responses').doc(r.id));audioDocs(r).forEach(d=>b.delete(d))})}
      const o=RAW[col].find(x=>x.id===id);if(o)audioDocs(o).forEach(d=>b.delete(d));
      b.delete(db.collection(col).doc(id));await b.commit();
    }else{
      if(col==='posts')RAW.responses=RAW.responses.filter(r=>r.post!==id);
      RAW[col]=RAW[col].filter(x=>x.id!==id);refresh();
    }
  },
  /* audio: Firestore docs hold at most ~1MB, so the recording is stored as base64 in chunks */
  async putAudio(blob){
    if(!blob)return {};
    if(!CLOUD)return {audioUrl:URL.createObjectURL(blob)};
    const data=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)});
    if(data.length>3800000)throw new Error('录音太大，请录短一点');
    const audioId=newId('a'),SZ=700000,parts=Math.ceil(data.length/SZ);
    const b=db.batch();
    for(let k=0;k<parts;k++)b.set(db.collection('audio').doc(audioId+'_'+k),{data:data.slice(k*SZ,(k+1)*SZ),k});
    await b.commit();AUD[audioId]=data;
    return {audioId,audioParts:parts};
  },
  async getAudio(item){
    if(item.audioUrl)return item.audioUrl;
    if(!item.audioId)return null;
    if(AUD[item.audioId])return AUD[item.audioId];
    if(!CLOUD)return null;
    const snaps=await Promise.all(Array.from({length:item.audioParts||1},(_,k)=>db.collection('audio').doc(item.audioId+'_'+k).get()));
    const data=snaps.map(s=>s.exists?s.data().data:'').join('');
    AUD[item.audioId]=data;return data;
  },
  async reset(){
    const seed=seedRaw();
    if(CLOUD){
      for(const col of ['posts','responses','topics','proposals','audio','session','checkins','practices']){
        const snap=await db.collection(col).get();
        for(let i=0;i<snap.docs.length;i+=400){const b=db.batch();snap.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}
      }
      await seedCloud(seed);
    }else{
      const mine=RAW.users.filter(u=>!/^s\d+$/.test(u.id));
      RAW=seed;RAW.users=RAW.users.concat(mine);refresh();
    }
  }
};
function clean(o){const r={};for(const k in o){if(o[k]!==undefined&&k!=='audioUrl'&&k!=='when'&&k!=='resp')r[k]=o[k]}return r}
function audioDocs(o){return o&&o.audioId?Array.from({length:o.audioParts||1},(_,k)=>db.collection('audio').doc(o.audioId+'_'+k)):[]}
async function seedCloud(seed){
  const b=db.batch();
  for(const col of COLS)for(const o of seed[col]){const {id,...rest}=o;b.set(db.collection(col).doc(id),clean(rest),{merge:col==='users'})}
  await b.commit();
}

let seenPosts=null,requestedSeed=false;
function refresh(){buildView();sessionWatch();requestRender()}
function setSync(state,detail){
  const c=document.getElementById('syncChip');
  if(c){c.className='sync '+(state==='on'?'on':state==='wait'?'':'off');c.innerHTML=`<i></i>${state==='on'?'即时同步中':state==='wait'?'连线中……':'示范模式（未连线）'}`;c.title=detail||''}
  const notes=document.querySelectorAll('.note-dyn');

  notes.forEach(n=>n.textContent=msg);

function startLocal(reason){
  UNSUB.forEach(u=>{try{u()}catch(e){}});UNSUB=[];
  CLOUD=false;LOADED=true;MYID='me';ME={id:'me',real:'展位访客',nick:'你（访客）'};
  RAW=seedRaw();setSync('off',reason||'');refresh();
}
function startCloud(){
  if(typeof firebase==='undefined'){startLocal('无法载入 Firebase');return}
  try{if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore()}catch(e){startLocal('Firebase 初始化失败');return}
  CLOUD=true;LOADED=false;setSync('wait');
  ME=ls.get('kaimai_me',null);MYID=ME?ME.id:null;
  const got={};
  const timer=setTimeout(()=>{if(!LOADED)startLocal('连线逾时：请确认 Firestore 已建立，且网络正常')},10000);
  COLS.forEach(col=>{
    const un=db.collection(col).onSnapshot(snap=>{
      if(!CLOUD)return;
      RAW[col]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      got[col]=true;
      if(col==='topics'&&snap.empty&&!requestedSeed){requestedSeed=true;seedCloud(seedRaw()).catch(e=>console.warn(e))}
      if(!LOADED&&COLS.every(c=>got[c])){LOADED=true;clearTimeout(timer);setSync('on')}
      if(col==='posts'){
        const ids=new Set(RAW.posts.map(p=>p.id));
        if(seenPosts&&LOADED){RAW.posts.filter(p=>!seenPosts.has(p.id)&&p.by!==MYID&&!p.hidden).forEach(p=>{const u=RAW.users.find(x=>x.id===p.by);toast(`${u?u.nick:'有同学'} 刚刚开麦了`)})}
        seenPosts=ids;
      }
      refresh();
    },err=>{
      console.warn('Firestore',col,err);
      if(!LOADED){clearTimeout(timer);startLocal(err&&err.code==='permission-denied'?'没有读取权限：请检查 Firestore 安全规则（测试模式可能已过期）':'云端资料库连不上：'+(err&&err.code||''))}
      else toast('同步中断，请检查网络');
    });
    UNSUB.push(un);
  });
}

function findItem(id){if(typeof id==='string'&&/^(pr|prd|ex):/.test(id))return findExtra(id);for(const p of D.posts){if(p.id===id)return p;for(const r of p.resp)if(r.id===id)return r}return null}

function paint(id,frac){document.querySelectorAll(`.wave[data-w="${id}"]`).forEach(w=>{const bars=w.children;const k=Math.round(frac*bars.length);for(let i=0;i<bars.length;i++)bars[i].classList.toggle('done',i<k)})}
function stopPlay(){if(!P.id)return;clearInterval(P.timer);try{speechSynthesis.cancel()}catch(e){}if(P.audio){try{P.audio.pause()}catch(e){}P.audio=null}paint(P.id,0);document.querySelectorAll(`[data-play="${P.id}"]`).forEach(b=>b.classList.remove('on'));P.id=null;setTimeout(()=>{if(typeof flushRender==='function')flushRender()},0)}
function playUrl(id,url){
  const au=new Audio(url);P.audio=au;P.len=Math.max(1,durFor(id))*1000;
  au.onended=()=>{if(P.id===id)stopPlay()};
  au.play().catch(()=>{toast('这台设备无法播放这段录音');stopPlay()});
  P.timer=setInterval(()=>{paint(id,Math.min(1,au.currentTime*1000/P.len))},120);
}
function togglePlay(id){
  if(P.id===id){stopPlay();return}
  stopPlay();
  P.id=id;
  document.querySelectorAll(`[data-play="${id}"]`).forEach(b=>b.classList.add('on'));
  const url=audioFor(id);
  if(url){playUrl(id,url);return}
  const it=findItem(id);
  if(it&&it.audioId){ // recording stored in the cloud: fetch it first
    toast('载入录音中……');
    api.getAudio(it).then(u=>{if(P.id!==id)return;if(u)playUrl(id,u);else{toast('找不到这段录音');stopPlay()}}).catch(()=>{toast('录音载入失败，请检查网络');stopPlay()});
    return;
  }
  const text=findText(id);P.len=Math.max(4,text.length*0.24)*1000;P.t0=Date.now();
  try{if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=1;const v=speechSynthesis.getVoices().find(v=>/zh/i.test(v.lang));if(v)u.voice=v;u.onend=()=>{if(P.id===id)stopPlay()};speechSynthesis.speak(u)}}catch(e){}
  P.timer=setInterval(()=>{const f=(Date.now()-P.t0)/P.len;if(f>=1){stopPlay();return}paint(id,f)},150);
}

/* ---------- microphone: real recording + live levels + speech-to-text when the browser offers it ---------- */
const MIC={active:false};
async function micStart(levelSel,capSel){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){const e=new Error('unsupported');e.name='Unsupported';throw e}
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  let mr;const mt=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'].find(t=>{try{return MediaRecorder.isTypeSupported(t)}catch(e){return false}});
  try{mr=new MediaRecorder(stream,Object.assign({audioBitsPerSecond:32000},mt?{mimeType:mt}:{}))}catch(e){mr=new MediaRecorder(stream)}
  const chunks=[];
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.start(250);
  Object.assign(MIC,{active:true,stream,mr,chunks,text:'',final:'',sr:null,ctx:null,raf:0});
  try{
    const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();MIC.ctx=ctx;try{ctx.resume()}catch(e){}
    const an=ctx.createAnalyser();an.fftSize=64;ctx.createMediaStreamSource(stream).connect(an);
    const buf=new Uint8Array(an.frequencyBinCount),tbuf=new Uint8Array(an.fftSize);
    /* voice stats for the AI echo: how much of the time the student was speaking, and the pauses */
    const st={t0:performance.now(),last:performance.now(),voiced:0,total:0,silRun:0,longest:0,pauses:0};MIC.stats=st;
    const loop=()=>{if(!MIC.active)return;an.getByteFrequencyData(buf);an.getByteTimeDomainData(tbuf);
      const bars=document.querySelectorAll(levelSel+' i');
      bars.forEach((b,i)=>{const v=buf[(i*2)%buf.length]/255;b.style.height=(12+v*88)+'%'});
      let sum=0;for(let i=0;i<tbuf.length;i++){const d=(tbuf[i]-128)/128;sum+=d*d}
      const rms=Math.sqrt(sum/tbuf.length),now=performance.now(),dt=Math.min(200,now-st.last);st.last=now;st.total+=dt;
      if(rms>0.025){st.voiced+=dt;if(st.silRun>2000)st.pauses++;st.silRun=0}else{st.silRun+=dt;if(st.silRun>st.longest)st.longest=st.silRun}
      MIC.raf=requestAnimationFrame(loop)};
    loop();
  }catch(e){}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){try{
    const sr=new SR();sr.lang='zh-CN';sr.continuous=true;sr.interimResults=true;
    sr.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)MIC.final+=t;else interim+=t}
      MIC.text=MIC.final+interim;const c=capSel&&document.querySelector(capSel);if(c)c.textContent=MIC.text||'……'};
    sr.onerror=()=>{};sr.onend=()=>{if(MIC.active){try{sr.start()}catch(e){}}};
    sr.start();MIC.sr=sr;
  }catch(e){}}
}
function micStop(){return new Promise(res=>{
  if(!MIC.active||!MIC.mr){res(null);return}
  MIC.active=false;cancelAnimationFrame(MIC.raf);
  try{MIC.sr&&MIC.sr.stop()}catch(e){}
  const mr=MIC.mr;
  mr.onstop=()=>{
    const blob=new Blob(MIC.chunks,{type:mr.mimeType||'audio/webm'});
    MIC.stream.getTracks().forEach(t=>t.stop());try{MIC.ctx&&MIC.ctx.close()}catch(e){}
    setTimeout(()=>res({url:URL.createObjectURL(blob),blob,text:(MIC.text||MIC.final||'').trim(),stats:MIC.stats||null}),600);
  };
  try{mr.stop()}catch(e){res(null)}
})}
function micAbort(){if(!MIC.active)return;MIC.active=false;cancelAnimationFrame(MIC.raf);
  try{MIC.sr&&MIC.sr.abort()}catch(e){}try{MIC.mr.onstop=null;MIC.mr.stop()}catch(e){}
  try{MIC.stream.getTracks().forEach(t=>t.stop())}catch(e){}try{MIC.ctx&&MIC.ctx.close()}catch(e){}}

/* ---------- AI echo (rule-based demo) ---------- */
function analyze(text){
  const good=[],tries=[],words=[];
  let lower=' '+text.toLowerCase()+' ';
  const keys=Object.keys(DICT).sort((a,b)=>b.length-a.length);
  for(const k of keys){const re=new RegExp('(^|[^a-z])'+k.replace(/[-]/g,'\\-')+'(?=[^a-z]|$)','g');if(re.test(lower)){words.push([k,DICT[k]]);lower=lower.replace(re,'$1 ')}}
  const rest=(lower.match(/[a-z]{2,}/g)||[]);rest.forEach(w=>{if(!words.some(x=>x[0]===w))words.push([w,null])});
  const cjk=(text.match(/[一-鿿]/g)||[]).length;
  if(/我觉得|我认为|我的看法|我同意|不同意/.test(text))good.push('你的立场很清楚，听众一开始就知道你站在哪一边。');else tries.push('开头先用一句话说清楚立场，例如“我觉得……”。');
  if(/因为|所以|原因|才会/.test(text))good.push('你说出了理由，不只是表态。');else tries.push('试着加一句“因为……”，让大家知道你为什么这样想。');
  if(/比如|例如|有一次|我自己|上个月|以前|我朋友|我表哥|我妈妈|我爸爸/.test(text))good.push('你用了自己的经历做例子，听众很容易有共鸣。');else tries.push('加一个你自己或身边人的小故事，观点会更有说服力。');
  if(/大家|你们|我想问|你呢/.test(text))good.push('你在和听众对话，很有播客的感觉。');
  const fill=(text.match(/然后|就是|那个|嗯/g)||[]).length;
  if(fill>=2)tries.push(`“就是”“然后”出现了 ${fill} 次。说之前先停一秒，听众反而更愿意听下去。`);
  if(cjk<35)tries.push('可以再多说一点，60 秒大约能说 150 个字。');
  return {good,tries:tries.slice(0,3),words,cjk};
}

/* feedback from the recording itself, so the AI echo works even without a transcript */
function voiceFeedback(r){
  const st=r.stats;if(!st||!st.total)return null;
  const ratio=Math.round(st.voiced/st.total*100),longest=Math.round(st.longest/100)/10,secs=r.secs||Math.round(st.total/1000);
  const good=[],tries=[];
  if(secs>=45)good.push(`你说了 ${secs} 秒，长度刚刚好，内容有时间展开。`);
  else if(secs<20)tries.push(`这次只说了 ${secs} 秒。试着说到 60 秒左右：先说立场，再加一个理由和一个例子。`);
  else tries.push(`你说了 ${secs} 秒。再多加一个例子，就能说到 60 秒左右。`);
  if(ratio>=70)good.push('你几乎没有冷场，说得很流畅。');
  else if(ratio<45)tries.push('停顿比较多。开始前先想好第一句话，说的时候就会顺很多。');
  if(longest>=3)tries.push(`最长停了 ${longest} 秒。卡住时可以先说“我想想……”或“比如说……”，帮自己接下去。`);
  else if(secs>=10)good.push('没有长时间的停顿，节奏很好。');
  return {ratio,longest,good,tries};
}

/* ---------- render ---------- */
function render(){
  S._pending=false;
  stopPlay();
  const pj=S.view==='teacher'&&S.proj&&S.teacherOK;
  dev.classList.toggle('wide',S.view==='teacher');dev.classList.toggle('proj',pj);
  document.querySelector('.shell')?.classList.toggle('projmode',pj);
  document.getElementById('vStudent').setAttribute('aria-pressed',S.view==='student');
  document.getElementById('vTeacher').setAttribute('aria-pressed',S.view==='teacher');
  const keepScroll=dev.querySelector('.scroll')?.scrollTop||0;
  const tn=dev.querySelector('.toast');
  dev.innerHTML = S.view==='student'?student():teacher();
  if(tn)dev.appendChild(tn);
  if(S._keep){const sc=dev.querySelector('.scroll');if(sc)sc.scrollTop=keepScroll;S._keep=false}
}

/* ---------- AI rubric (rule-based prototype) ---------- */
function enWords(t){return (t.match(/[A-Za-z]{2,}/g)||[]).filter(w=>!/^(cca|ok)$/i.test(w))}
function posOf(t,re){const m=t.search(re);return m<0?-1:m/Math.max(1,t.length)}
function evalCrit(k,t,seg){
  t=(t||'').trim();if((t.match(/[一-鿿]/g)||[]).length<3)return null;
  switch(k){
   case 'stand':{const p=posOf(t,/不同意|同意|我认为|我觉得|我支持|我反对|赞成|反对|我的看法/);if(p<0)return /看情况|还好|都可以/.test(t)?1:0;if(/看情况|还好吧|都可以/.test(t))return 1;return seg||p<=0.35?2:1}
   case 'reason':{const m=t.match(/(因为|原因是|由于|之所以)([^。！？，,.!?]*)/);if(!m)return 0;return (m[2].match(/[一-鿿]/g)||[]).length>=8?2:1}
   case 'example':{if(/比如|例如|举个例子|譬如|有一次|上个月|去年|上次|昨天|我表哥|我表姐|我朋友|我同学|我妈|我爸|我哥|我姐|我弟|我妹|我身边/.test(t))return 2;if(/很多人|有的人|有些人|大家都|别人都/.test(t))return 1;return 0}
   case 'counter':{const p=t.search(/也许有人|有人会说|有人认为|有人觉得|有些人认为|有些人觉得|有些人会说|别人可能|虽然/);if(p<0)return 0;return /但是|可是|不过|然而|但/.test(t.slice(p+2))?2:1}
   case 'close':{const p=posOf(t,/所以|总之|总的来说|总而言之|我希望|我呼吁|让我们|大家应该|我建议|希望大家/);if(p<0)return 0;if(seg)return 2;return p>=0.6?2:1}
   case 'lang':{const n=enWords(t).length;return n<=1?2:n<=3?1:0}
  }
  return null;
}
function evalFlow(stats,secs,seg){
  if(!stats||!stats.total)return null;
  const ratio=stats.voiced/stats.total,longest=stats.longest/1000;
  if(seg)return secs>=6&&longest<3&&ratio>=0.4?2:secs>=3?1:0;
  return secs>=45&&longest<3&&ratio>=0.5?2:secs>=25&&longest<5?1:0;
}
function aiFull(text,stats,secs){const o={};SCAF.forEach(s=>o[s.k]=evalCrit(s.k,text,false));o.lang=evalCrit('lang',text);o.flow=evalFlow(stats,secs,false);return o}
function combineSeg(segs){
  const o={};SCAF.forEach((s,i)=>{o[s.k]=segs[i]&&segs[i].ai&&segs[i].ai[s.k]!=null?segs[i].ai[s.k]:null});
  o.lang=evalCrit('lang',segs.map(g=>(g&&g.text)||'').join('。'));
  const f=segs.map(g=>g&&g.ai?g.ai.flow:null).filter(v=>v!=null);o.flow=f.length?Math.round(f.reduce((a,b)=>a+b,0)/f.length):null;
  return o;
}
function rubricNext(ai){const out=[];if(!ai)return out;[0,1].forEach(l=>CRIT.forEach(c=>{if(ai[c.k]===l&&out.length<3)out.push(TIPS[c.k][l])}));return out}
function critRow(k,v){const c=CRIT.find(x=>x.k===k);const n=v==null;return `<div class="rubrow"><span class="stepchip" style="background:${c.c}">${c.n}</span><span class="rt"><b>${c.t}</b><small>${n?(k==='flow'?'需要录音才能评':'需要文字稿才能评'):RUBRIC[k][v]}</small></span><span class="rpill ${n?'ln':'l'+v}">${n?'未评':LVL[v]}</span></div>`}
function rubricTable(ai){return `<div class="rub">${CRIT.map(c=>critRow(c.k,ai?ai[c.k]:null)).join('')}</div>`}
function rubricPills(ai){return CRIT.map(c=>{const v=ai?ai[c.k]:null;return `<span class="rp ${v==null?'ln':'l'+v}" title="${c.t}：${v==null?'未评':LVL[v]}">${c.n}</span>`}).join('')}
function nextTips(ai){
  const t=rubricNext(ai);if(t.length)return `<div class="fb try"><h4>下一步可以试试</h4><ul>${t.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  if(!ai||CRIT.every(c=>ai[c.k]==null))return '';
  return `<div class="fb good"><h4>做得很好</h4>评到的每一项都做到了。试试更高的难度吧！</div>`;
}
function rubricRef(){return `<details class="panel" style="margin-top:12px"><summary style="font-weight:700;cursor:pointer">查看 rubric（立、理、例、驳、结 + 语言、流畅）</summary><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>项目</th><th>还没做到</th><th>部分做到</th><th>已做到</th></tr></thead><tbody>${CRIT.map(c=>`<tr><td><b>${c.n}</b> ${c.t}</td>${RUBRIC[c.k].map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`}

function checkin(fields){const s=sess();if(!s||!MYID)return Promise.resolve();return api.upsert('checkins',s.id+'_'+MYID,Object.assign({session:s.id,by:MYID},fields))}
function getVote(tid){const s=sess();if(s&&s.topic===tid){const c=myCheck();if(c&&c.vote)return c.vote}return S.votes[tid]||null}
function latestPerStudent(list){const m={};list.forEach(p=>{const t=p.updatedAt||p.createdAt||0;if(!m[p.by]||t>(m[p.by].updatedAt||m[p.by].createdAt||0))m[p.by]=p});return Object.values(m)}
function aiSummary(prs){const out=[];CRIT.forEach(c=>{const who=prs.filter(p=>p.ai&&p.ai[c.k]===0);if(who.length)out.push({c,n:who.length,names:who.map(p=>stu(p.by).real)})});return out.sort((a,b)=>b.n-a.n)}
function sessionWatch(){

function posTrack(ch,key,teacher,showBefore){

  const d=dots.map(c=>{const u=stu(c.by);return teacher

    :`<i class="dot ${c.by===MYID&&S.view==='student'?'me':''}" style="left:${c[key]}%"></i>`}).join('');

function wallCards(teacher){

function learnBlock(tid){

function evalPr(i){
  const r=S.pr,g=r.segs[i];
  if(r.mode==='seg'){const k=SCAF[i].k;g.ai={[k]:evalCrit(k,g.text,true),lang:evalCrit('lang',g.text),flow:evalFlow(g.stats,g.secs,true)};r.ai=combineSeg(r.segs)}
  else{g.ai=aiFull(g.text,g.stats,g.secs);r.ai=g.ai}
}
async function savePr(){
  const r=S.pr;if(!r||!MYID)return;
  try{
    for(const g of r.segs){if(g.done&&g.blob&&!g.audioId&&!g.up){g.up=true;try{const a=await api.putAudio(g.blob);if(a.audioId){g.audioId=a.audioId;g.audioParts=a.audioParts}}finally{g.up=false}}}
    const out=g=>{const o={text:g.text||'',dur:g.secs||0,ai:g.ai||null,done:!!g.done};if(g.audioId){o.audioId=g.audioId;o.audioParts=g.audioParts||1}if(!CLOUD&&g.audioUrl)o.audioUrl=g.audioUrl;return o};
    const f={by:MYID,topic:r.topic,mode:r.mode,level:r.level,ai:r.ai||null,session:r.session||null,done:r.segs.filter(g=>g.done).length,updatedAt:Date.now()};
    if(r.mode==='seg')f.segments=r.segs.map(out);
    else{const g=out(r.segs[0]);f.text=g.text;f.dur=g.dur;if(g.audioId){f.audioId=g.audioId;f.audioParts=g.audioParts}if(g.audioUrl)f.audioUrl=g.audioUrl}
    if(!r.docId){r.docId=newId('x');f.createdAt=Date.now();f.share='none';f.comments=[]}
    await api.upsert('practices',r.docId,f);
  }catch(e){console.warn(e);toast('练习没有保存成功：'+(e&&e.message?e.message:'请检查网络'))}
}

function stageLive(s,teacher){
  const ch=sessChecks();
  switch(s.stage){
   case 'feel':return feelBars(ch,teacher);
   case 'spectrum':{let x=posTrack(ch,'pos',teacher,false);const d=ch.filter(c=>c.pos!=null).sort((a,b)=>a.pos-b.pos);
     if(teacher&&d.length>=2)x+=`<p class="hint">想引发讨论？可以请立场最不同的 <b>${esc(stu(d[0].by).real)}</b>（${posLabel(d[0].pos)}）和 <b>${esc(stu(d[d.length-1].by).real)}</b>（${posLabel(d[d.length-1].pos)}）说说想法。</p>`;return x}
   case 'respectrum':{let x=posTrack(ch,'pos2',teacher,true)+'<p class="hint">灰点：上课一开始　蓝点：现在</p>';
     if(teacher){const moved=ch.filter(c=>c.pos!=null&&c.pos2!=null&&posLabel(c.pos2)!==posLabel(c.pos));x+=moved.length?`<p class="hint">立场有改变的同学（${moved.length} 位）：${moved.map(c=>`${esc(stu(c.by).real)} ${posLabel(c.pos)}→${posLabel(c.pos2)}`).join('；')}</p>`:''}return x}
   case 'wall':return `<div class="wallgrid">${wallCards(teacher)}</div>`;
   case 'learn':return `${voteBars(ch)}<p class="hint">学生投票后，可以自己打开“看看示例 B 好在哪里”。在大屏上也可以一起揭晓。</p>`;
   case 'practice':return practiceLive(s,teacher);
   case 'end':return endSummary(s,ch);
  }
  return '';
}
function practiceLive(s,teacher){
  const prs=latestPerStudent(D.practices.filter(p=>p.session===s.id));
  const sum=aiSummary(prs);
  const sumHTML=sum.length?`<div class="fb try" style="margin-bottom:10px"><h4>AI 先筛</h4><ul>${sum.slice(0,4).map(x=>`<li>有 ${x.n} 位同学还没做到“${x.c.t}”${teacher?'：'+x.names.map(esc).join('、'):''}</li>`).join('')}</ul></div>`:'';
  if(!prs.length)return '<div class="empty">还没有同学开始练习。</div>';
  if(!teacher){
    const stepDone=SCAF.map((st,i)=>prs.filter(p=>p.mode==='seg'?(p.segments||[])[i]&&p.segments[i].done:(p.done||0)>0).length);const max=Math.max(1,prs.length);
    return `${sumHTML}<p class="hint">${prs.length} 位同学正在练习</p><div class="bars">${SCAF.map((st,i)=>`<div class="barrow"><span class="stepchip" style="background:${st.c};justify-self:center">${st.n}</span><div class="bartrack"><div class="bar" style="width:${stepDone[i]/max*100}%;background:${st.c}"></div></div><b class="n">${stepDone[i]}</b></div>`).join('')}</div><p class="hint">每一步已经完成的人数</p>`;
  }
  return `${sumHTML}<div class="tablewrap"><table><thead><tr><th>学生</th><th>模式</th><th>难度</th><th>进度</th><th>AI rubric</th></tr></thead><tbody>${prs.map(p=>`<tr><td>${esc(stu(p.by).real)}</td><td>${p.mode==='seg'?'分段':'完整'}</td><td>${LVNAME[p.level]||''}</td><td class="n">${p.mode==='seg'?(p.done||0)+'/5':(p.done?'已录':'未录')}</td><td><span class="rpills">${rubricPills(p.ai)}</span></td></tr>`).join('')}</tbody></table></div><p class="hint">要看录音和留评语，请到“学练”分页。</p>`;
}

/* join card: QR code of this page's address, for students to scan */
function joinUrl(){return location.href.split('#')[0]}
function qrOK(){return /^https?:$/.test(location.protocol)&&!/claude|localhost|127\.0\.0\.1/.test(location.hostname)&&typeof qrcode!=='undefined'}
function qrSVG(t){try{const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){return ''}}
function joinCard(big){
  const url=joinUrl(),ok=qrOK();
  return `<div class="joincard ${big?'big':''}">${ok?`<div class="qr" role="img" aria-label="加入开麦的二维码">${qrSVG(url)}</div>`:''}<div class="jtx"><b>学生用手机扫码加入</b><span class="jurl">${esc(url)}</span>${ok?'<small>扫码后取一个昵称，手机就会跟着老师的步骤走。</small>':'<small>现在是本机文件或预览，这个网址别人打不开。请先把网站部署到 Netlify，再用那个网址打开，这里就会出现可以扫的二维码。</small>'}</div></div>`;
}

function demoPractice(sid,uid,topic,kind){
  const ex=exOf(topic),now=Date.now();
  const segOf=(texts)=>texts.map((tx,i)=>{const g={text:tx,secs:12,stats:{total:12000,voiced:9000,longest:900},done:true};g.ai={[SCAF[i].k]:evalCrit(SCAF[i].k,tx,true),lang:evalCrit('lang',tx),flow:evalFlow(g.stats,12,true)};return g});
  let p;
  if(kind[0]==='seg'){const n=kind[1];const segs=segOf(ex.good.slice(0,n));while(segs.length<5)segs.push({});const out=segs.map(g=>({text:g.text||'',dur:g.secs||0,ai:g.ai||null,done:!!g.done}));p={mode:'seg',level:kind[2],segments:out,ai:combineSeg(segs),done:n}}
  else{const tx=kind[1];const st={total:60000,voiced:kind[3]||46000,longest:kind[4]||1600};p={mode:'full',level:kind[2],text:tx,dur:60,ai:aiFull(tx,st,60),done:1}}

}

/* re-render on data changes, but never while someone is typing, recording or listening */
function busy(){
  const a=document.activeElement;
  if(a&&dev.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return true;
  if(MIC.active||P.id)return true;
  if(['starting','saving','rec'].includes(S.rec.status))return true;
  if(['starting','saving','rec'].includes(S.comp.recState))return true;
  if(S.pr&&['starting','saving','rec'].includes(S.pr.recState))return true;
  return !!S.working;
}
function requestRender(){if(busy()){S._pending=true;return}S._keep=true;render()}
function flushRender(){if(S._pending&&!busy()){S._pending=false;S._keep=true;render()}}
dev.addEventListener('focusout',()=>setTimeout(flushRender,0));

function resetComp(){stopCompTimer();if(S.comp&&S.comp.recState==='rec')micAbort();S.comp={tag:'agree',mode:'voice',text:PREFIX.agree,recState:'idle',secs:0,audioUrl:null,blob:null,demo:false}}

function leaveRec(){stopRecTimer();if(S.rec.status==='rec'&&S.rec.mode==='real')micAbort();S.rec.status='idle';if(S.pr&&['rec','starting'].includes(S.pr.recState)){clearInterval(S.pr.timer);micAbort();S.pr.recState='idle'}}

function pick(arr,not){const a=arr.filter(x=>x!==not);return a[Math.floor(Math.random()*a.length)]||arr[0]}
function lookup(q){
  if(DICT[q])return [q,DICT[q]];
  const tries=[q.replace(/ies$/,'y'),q.replace(/es$/,''),q.replace(/s$/,''),q.replace(/ing$/,''),q.replace(/ing$/,'e'),q.replace(/ed$/,''),q.replace(/d$/,''),q.replace(/-/g,' '),q.replace(/ /g,'-'),q.replace(/ /g,'')];
  for(const t of tries)if(t&&DICT[t])return [t,DICT[t]];
  return null;
}

    const nick=S.join.nick.trim(),real=S.join.real.trim();
    if(!nick){S.join.err='请先取一个昵称';render();return}
    if(D.students.some(u=>u.nick===nick)){S.join.err='这个昵称已经有人用了，换一个吧';render();return}
    const me={id:newId('u'),nick,real:real||'（未填姓名）'};
    document.activeElement?.blur();
    guard(async()=>{await api.add('users',Object.assign({},me));ME=me;MYID=me.id;ls.set('kaimai_me',me);S.join=null;buildView();if(sess())S.screen='class';render()},`欢迎你，${nick}！`);
  }
});
dev.addEventListener('change',e=>{if(e.target.name==='ntMode'){S.newT.mode=e.target.value;S._keep=true;render()}});
dev.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='rq'){e.preventDefault();dev.querySelector('[data-a="rescue"]').click()}});

dev.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;
  switch(a){
  case 'nav': leaveRec();resetComp();go(b.dataset.s);dev.querySelector('.scroll').scrollTop=0;break;
  case 'openTopic': leaveRec();resetComp();S.spark=null;go('topic',{topic:b.dataset.t});dev.querySelector('.scroll').scrollTop=0;break;
  case 'openPost': resetComp();go('post',{post:b.dataset.p});dev.querySelector('.scroll').scrollTop=0;break;
  case 'play': togglePlay(b.dataset.play);break;
  case 'sparkT': {const t=topicOf(S.topic);if(t){S.spark=pick(t.sparks||[''],S.spark);S._keep=true;render()}break}
  case 'startRec': {
    const live=D.topics.filter(t=>t.status==='live');if(!live.length){toast('目前没有开放的话题');break}
    const t=b.dataset.t&&topicOf(b.dataset.t)?.status==='live'?b.dataset.t:(S.screen==='topic'&&topicOf(S.topic)?.status==='live'?S.topic:live[0].id);
    leaveRec();resetComp();S.rec=newRec(t);go('rec');dev.querySelector('.scroll').scrollTop=0;break}
  case 'recTopic': S.rec.topic=b.dataset.t;S.rec.spark=null;S._keep=true;render();break;
  case 'sparkR': S.rec.spark=pick(topicOf(S.rec.topic)?.sparks||[''],S.rec.spark);S._keep=true;render();break;
  case 'rescue': {
    const q=S.rec.rescueQ.trim().toLowerCase().replace(/[.,!?;:"“”]/g,'').replace(/\s+/g,' ');if(!q)break;
    const found=lookup(q);
    if(found){S.rec.rescueA=`<span style="font-family:var(--f-mono)">${esc(found[0])}</span> → <b>${esc(found[1])}</b>`;addWords([found])}
    else{const near=Object.keys(DICT).filter(k=>k.length>2&&(k.includes(q)||q.includes(k))).slice(0,4);
      S.rec.rescueA=`词库里还没有“${esc(q)}”。`+(near.length?`相近的词：${near.map(k=>`<span style="font-family:var(--f-mono)">${esc(k)}</span> → ${esc(DICT[k])}`).join('；')}`:'试试换个说法，或者先用简单的中文描述它。');}
    S._keep=true;render();break}
  case 'recBack': leaveRec();if(S.rec.step>1){S.rec.step=1;S.rec.secs=0;S.rec.err=null;render()}else go('home');break;
  case 'recGo': S.rec.step=2;S.rec.secs=0;S.rec.err=null;S.rec.status='idle';render();break;
  case 'recStart': (async()=>{
    S.rec.status='starting';S.rec.err=null;S.rec.secs=0;render();
    try{await micStart('#recBars','#liveCap');S.rec.mode='real';S.rec.status='rec';startRecTimer();render()}
    catch(err){S.rec.status='idle';S.rec.err=micErr(err);render()}
  })();break;
  case 'recDemo': S.rec.mode='demo';S.rec.err=null;S.rec.status='rec';S.rec.secs=0;startRecTimer();render();break;
  case 'recStop': (async()=>{
    stopRecTimer();
    if(S.rec.mode==='real'){
      S.rec.status='saving';render();
      const res=await micStop();
      S.rec.audioUrl=res?res.url:null;S.rec.blob=res?res.blob:null;S.rec.text=res?res.text:'';S.rec.stats=res?res.stats:null;
    }else{S.rec.audioUrl=null;S.rec.blob=null;S.rec.text=DEMO[S.rec.topic]||DEMO.def}
    S.rec.secs=Math.max(1,S.rec.secs);S.rec.status='idle';S.rec.step=3;render();dev.querySelector('.scroll').scrollTop=0;
  })();break;
  case 'reEcho': S._keep=true;render();break;
  case 'reRec': S.rec.step=2;S.rec.secs=0;S.rec.status='idle';S.rec.err=null;S.rec.mode='real';S.rec.audioUrl=null;S.rec.blob=null;S.rec.stats=null;S.rec.text='';render();break;
  case 'saveDraft': {
    const id=S.rec.draftId||('d'+Date.now());S.rec.draftId=id;
    const ex=D.drafts.find(d=>d.id===id);const rec={id,topic:S.rec.topic,text:S.rec.text,secs:S.rec.secs,audioUrl:S.rec.audioUrl,blob:S.rec.blob,stats:S.rec.stats,mode:S.rec.mode};
    if(ex)Object.assign(ex,rec);else D.drafts.unshift(rec);
    go('me');toast('已存草稿，只有你看得到');break}
  case 'openDraft': {const d=D.drafts.find(x=>x.id===b.dataset.d);if(!d)break;S.rec=Object.assign(newRec(d.topic),{step:3,secs:d.secs,text:d.text,draftId:d.id,audioUrl:d.audioUrl,blob:d.blob,stats:d.stats,mode:d.mode||'real'});go('rec');break}
  case 'publish': {
    if(S.working)break;
    const r=S.rec,txt=r.text.trim();
    if(!txt&&!r.blob){toast('还没有录音，先说点什么吧');break}
    if(!topicOf(r.topic)||topicOf(r.topic).status!=='live'){toast('这个话题已经关闭了');break}
    if(txt)addWords(analyze(txt).words);
    const dur=r.blob?Math.max(1,r.secs):Math.max(20,Math.min(90,r.secs||Math.round(txt.length*0.3)));
    b.disabled=true;b.textContent='发布中……';
    guard(async()=>{
      const aud=await api.putAudio(r.blob);
      const post=Object.assign({topic:r.topic,by:MYID,dur,pinned:false,hidden:false,reports:0,likes:0,text:txt},aud);
      const fl=aiFlag(txt);if(fl)post.aiflag=fl;
      const pid=await api.add('posts',post);
      if(!CLOUD){setTimeout(()=>{const o=RAW.posts.find(p=>p.id===pid);if(!o||o.hidden)return;o.likes=(o.likes||0)+3;refresh();toast('有 3 位同学喜欢你的播客')},6000)}
      if(r.draftId)D.drafts=D.drafts.filter(d=>d.id!==r.draftId);
      S.working=false;go('topic',{topic:r.topic,spark:null});
    },'已发布！同学现在听得到了');
    break}
  case 'cTag': {const old=S.comp.tag,k=b.dataset.k;S.comp.tag=k;
    if(S.comp.text.startsWith(PREFIX[old]))S.comp.text=PREFIX[k]+S.comp.text.slice(PREFIX[old].length);else if(!S.comp.text.trim()&&S.comp.mode==='text')S.comp.text=PREFIX[k];
    S._keep=true;render();break}
  case 'cMode': {const m=b.dataset.m;if(m===S.comp.mode)break;const tag=S.comp.tag;resetComp();S.comp.tag=tag;S.comp.mode=m;S.comp.text=m==='text'?PREFIX[tag]:'';S._keep=true;render();break}
  case 'cRedo': {const tag=S.comp.tag;resetComp();S.comp.tag=tag;S.comp.text='';S._keep=true;render();break}
  case 'cRec': (async()=>{
    S.comp.recState='starting';S.comp.secs=0;S._keep=true;render();
    try{await micStart('#cBars',null);S.comp.demo=false;S.comp.recState='rec';startCompTimer();S._keep=true;render()}
    catch(err){S.comp.demo=true;S.comp.recState='rec';startCompTimer();S._keep=true;render();toast(micErr(err)==='denied'?'麦克风权限被拒绝，改用示范录音':'这里不能用麦克风，改用示范录音')}
  })();break;
  case 'cStop': (async()=>{
    stopCompTimer();
    if(!S.comp.demo){S.comp.recState='saving';S._keep=true;render();const res=await micStop();S.comp.audioUrl=res?res.url:null;S.comp.blob=res?res.blob:null;S.comp.text=res?res.text:''}
    else{const ex={agree:'这个说法让我想起我自己的经历。',differ:'换个角度看，其实还有别的可能。',ask:'你当时是怎么想的？'};S.comp.text=PREFIX[S.comp.tag]+ex[S.comp.tag]}
    S.comp.secs=Math.max(1,S.comp.secs);S.comp.recState='done';S._keep=true;render();
  })();break;
  case 'cSend': {
    if(S.working)break;
    const c=S.comp;const txt=c.text.trim();
    if(c.mode==='text'&&(!txt||txt===PREFIX[c.tag].trim())){toast('先把想说的话补完整');break}
    if(c.mode==='voice'&&!c.blob&&!txt){toast('先录一段语音');break}
    const postId=S.post;
    b.disabled=true;b.textContent='送出中……';
    guard(async()=>{
      const aud=c.mode==='voice'?await api.putAudio(c.blob):{};
      const resp=Object.assign({post:postId,by:MYID,tag:c.tag,mode:c.mode,text:txt,hidden:false,reports:0},aud);
      if(c.mode==='voice')resp.dur=Math.max(1,c.secs);
      const fl=aiFlag(txt);if(fl)resp.aiflag=fl;
      await api.add('responses',resp);
      resetComp();S.working=false;S._keep=true;render();
    },'回应已送出');
    break}
  case 'like': {
    const p=D.posts.find(x=>x.id===b.dataset.p);if(!p)break;
    const on=!LIKED.has(p.id);if(on)LIKED.add(p.id);else LIKED.delete(p.id);ls.set('kaimai_liked',[...LIKED]);
    document.querySelectorAll(`[data-a="like"][data-p="${p.id}"]`).forEach(x=>{x.outerHTML=likeCtl(p)});
    if(on)document.querySelectorAll(`[data-a="like"][data-p="${p.id}"]`).forEach(x=>x.classList.add('pop'));
    api.inc('posts',p.id,'likes',on?1:-1).catch(()=>toast('没有成功，请检查网络'));
    break}
  case 'report': {const f=findAny(b.dataset.r);if(!f)break;guard(()=>api.inc(f.col,f.o.id,'reports',1),'已检举，老师会查看');break}
  case 'propose': {const t=S.propose.trim();if(!t){toast('先写下你想聊的问题');break}S.propose='';guard(()=>api.add('proposals',{by:MYID,title:t}),'提名已送给老师');break}
  /* teacher */
  case 'toStudent': S.view='student';S.pinErr=false;S.pin='';render();break;
  case 'logout': S.proj=false;S.teacherOK=false;S.view='student';S.confirm=null;render();toast('已登出');break;
  case 'tt': S.tt=b.dataset.k;S.confirm=null;render();break;
  case 'filter': S.filter=b.dataset.k;S._keep=true;render();break;
  case 'pin': {const f=findAny(b.dataset.id);if(!f)break;const v=!f.o.pinned;guard(()=>api.update(f.col,f.o.id,{pinned:v}),v?'已置顶，学生会看到“老师推荐”':'已取消置顶');break}
  case 'hide': {const f=findAny(b.dataset.id);if(!f)break;const v=!f.o.hidden;guard(()=>api.update(f.col,f.o.id,{hidden:v}),v?'已隐藏，学生看不到了':'已恢复显示');break}
  case 'clear': {const f=findAny(b.dataset.id);if(!f)break;guard(()=>api.update(f.col,f.o.id,{reports:0,aiflag:undefined}),'已标记为没问题');break}
  case 'askDel': S.confirm=b.dataset.id;S._keep=true;render();break;
  case 'cancelDel': S.confirm=null;S._keep=true;render();break;
  case 'del': {const f=findAny(b.dataset.id);S.confirm=null;if(!f){render();break}guard(()=>api.remove(f.col,f.o.id),'已删除');break}
  case 'tStatus': {const t=topicOf(b.dataset.t);if(!t)break;const v=b.dataset.v;
    const fields=v==='live'?{status:'live',when:'刚刚上线',order:Date.now()}:{status:'arch',when:'已归档'};
    guard(()=>api.update('topics',t.id,fields),v==='live'?'话题已上线，学生端首页看得到':'话题已归档');break}
  case 'addTopic': {
    const n=S.newT;if(!n.title.trim()){toast('先写下话题');break}
    const sparks=n.sparks.split('\n').map(x=>x.trim()).filter(Boolean);
    const now=n.mode==='now';
    const t={title:n.title.trim(),desc:n.desc.trim()||'说说你的看法。',status:now?'live':'sched',order:now?Date.now():-Date.now(),
      when:now?'本周 · 刚刚上线':'排定：'+n.date.replace(/^(\d+)-(\d+)-(\d+)$/,(m,y,mo,d)=>`${+mo}月${+d}日上线`),sparks:sparks.length?sparks:['想想一件和这个话题有关的小事。']};
    S.newT={title:'',desc:'',sparks:'',mode:'now',date:'2026-10-26'};
    guard(()=>api.add('topics',t),now?'已上线，成为学生端的本周话题':'已排定');render();break}
  case 'adopt': {const p=D.proposals.find(x=>x.id===b.dataset.p);if(!p)break;S.newT.title=p.title;S.newT.desc='这个话题由'+(stu(p.by).nick)+'提名。';
    guard(()=>api.remove('proposals',p.id),'已填进“新增话题”，确认后上线');render();break}
  case 'decline': guard(()=>api.remove('proposals',b.dataset.p),'已婉拒');break;
  case 'askReset': S.confirm='__reset';S._keep=true;render();break;
  case 'doReset': S.confirm=null;guard(()=>api.reset(),'已还原示范数据');break;
  }
});

document.getElementById('vStudent').onclick=()=>{S.view='student';S.confirm=null;render()};
document.getElementById('vTeacher').onclick=()=>{leaveRec();resetComp();S.view='teacher';S.pinErr=false;render();document.getElementById('pin')?.focus()};
try{speechSynthesis.getVoices()}catch(e){}
render();
startCloud();
})();
</script>
